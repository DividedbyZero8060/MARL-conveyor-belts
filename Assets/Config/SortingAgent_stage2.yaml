# Curriculum Stage 2 — two package types (Small + Medium).
# Warm-started from Stage 1 checkpoint via mlagents-learn --initialize-from.
# Warm-start SOURCE for Stage 3.
#
# Scene config before running:
#   PackageSpawner._packageTypes = [SmallParcel, MediumBox]
#   (all other toggles unchanged from Stage 1)
#
# Expected outcome: target >= 75% sort accuracy by 400k. Warm-start hypothesis:
#   should beat non-warm-started Level 2 (75% at 200k) by leveraging Stage 1's
#   "fire on matching package" reflex.

behaviors:
  SortingAgent:
    trainer_type: poca
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-2
      beta_schedule: constant
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 50000
    max_steps: 400000
    time_horizon: 64
    summary_freq: 5000
    threaded: false