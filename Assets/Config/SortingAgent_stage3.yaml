# Curriculum Stage 3 — three package types (full task).
# Warm-started from Stage 2 checkpoint via mlagents-learn --initialize-from.
# No warm-start target — this is the thesis Level 3 result.
#
# Scene config before running:
#   PackageSpawner._packageTypes = [SmallParcel, MediumBox, LargeCrate]
#   (all other toggles unchanged from Stages 1-2)
#
# Expected outcome: primary research result. If > 33% (cold-start baseline),
# curriculum warm-start helped. If <= 33%, entropy collapse dominates and the
# null result is itself a thesis contribution.

behaviors:
  SortingAgent:
    trainer_type: poca
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-2
      beta_schedule: constant
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 100000
    max_steps: 1000000
    time_horizon: 64
    summary_freq: 5000
    threaded: false